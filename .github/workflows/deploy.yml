name: Deploy to Cloudflare Workers

# Deploys the Robert Coles memorial on every push to the working branch (and
# main), plus manual runs.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  – token with Workers Scripts: Edit, D1, KV,
#                           Workers AI, and Vectorize permissions
#   CLOUDFLARE_ACCOUNT_ID – your Cloudflare account id
# Optional repo secret:
#   MAPBOX_TOKEN          – your Mapbox publishable token (pk.…). If set, it's
#                           uploaded as an encrypted Worker secret so the
#                           Journeys map renders. If absent, the site still
#                           deploys and the map shows a "add token" notice.
on:
  push:
    branches:
      - claude/robert-coles-memorial-site-gtn3ll
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Node 22 so the project's wrangler 4.x runs (wrangler 4 needs Node >= 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vectorize index for "Ask the Archive". Idempotent: the create call fails
      # harmlessly if the index already exists.
      - name: Ensure Vectorize index exists
        run: |
          npx wrangler vectorize create robert-coles-corpus \
            --dimensions=768 --metric=cosine \
          || echo "Vectorize index already exists — continuing."

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Upload the Mapbox publishable token as an encrypted Worker secret — only
      # if it's provided. A new Worker version with the secret is published, so
      # the map starts rendering. Skipped (deploy still succeeds) when absent.
      - name: Set Mapbox token (optional)
        if: ${{ env.MAPBOX_TOKEN != '' }}
        run: printf '%s' "$MAPBOX_TOKEN" | npx wrangler secret put MAPBOX_TOKEN

      # Best-effort: build the semantic index so Ask the Archive answers right
      # away. The nightly cron also rebuilds it, so a failure here is non-fatal.
      - name: Warm the vector index
        if: steps.deploy.outputs.deployment-url != ''
        continue-on-error: true
        run: |
          echo "Reindexing at ${{ steps.deploy.outputs.deployment-url }}"
          curl -fsS -X POST "${{ steps.deploy.outputs.deployment-url }}/api/admin/reindex" \
            -H "content-type: application/json" || echo "Reindex will run on the nightly cron instead."
