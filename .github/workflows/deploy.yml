name: Deploy to Cloudflare Workers

# Deploys the Robert Coles memorial on every push to the working branch (and
# main), plus manual runs. Requires three repository secrets:
#   CLOUDFLARE_API_TOKEN  – a token with Workers Scripts: Edit, D1, KV,
#                           Workers AI, and Vectorize permissions
#   CLOUDFLARE_ACCOUNT_ID – your Cloudflare account id
#   MAPBOX_TOKEN          – your Mapbox publishable token (pk.…); uploaded to
#                           the Worker as an encrypted secret during deploy
on:
  push:
    branches:
      - claude/robert-coles-memorial-site-gtn3ll
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Vectorize index for "Ask the Archive". Idempotent: the create call fails
      # harmlessly if the index already exists.
      - name: Ensure Vectorize index exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler vectorize create robert-coles-corpus \
            --dimensions=768 --metric=cosine \
          || echo "Vectorize index already exists — continuing."

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Upload the Mapbox publishable token as an encrypted Worker secret
          # (read at runtime as env.MAPBOX_TOKEN), so it stays out of git.
          secrets: |
            MAPBOX_TOKEN
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      # Best-effort: build the semantic index so Ask the Archive answers right
      # away. The nightly cron also rebuilds it, so a failure here is non-fatal.
      - name: Warm the vector index
        if: steps.deploy.outputs.deployment-url != ''
        continue-on-error: true
        run: |
          echo "Reindexing at ${{ steps.deploy.outputs.deployment-url }}"
          curl -fsS -X POST "${{ steps.deploy.outputs.deployment-url }}/api/admin/reindex" \
            -H "content-type: application/json" || echo "Reindex will run on the nightly cron instead."
